<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Translator</title><link rel="stylesheet" href="popup.css"></head><body><main class="app"><header><div class="logo">文</div><div><h1>Chat Translator</h1><p>ترجمه چت با Bing</p></div><span id="statusDot" class="dot"></span></header><section class="hero"><div><strong id="statusText">فعال</strong><small>ترجمه خودکار پیام‌ها</small></div><label class="switch"><input id="enabled" type="checkbox"><span></span></label></section><section class="card"><h2>زبان مقصد</h2><select id="targetLang"><option value="fa">فارسی</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="tr">Türkçe</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="ja">日本語</option><option value="ko">한국어</option></select></section><section class="card"><h2>پلتفرم‌ها</h2><label class="row"><span><b>Twitch</b><small>ترجمه چت Twitch</small></span><input id="twitchEnabled" class="check" type="checkbox"><i></i></label><label class="row"><span><b>Kick</b><small>ترجمه چت Kick</small></span><input id="kickEnabled" class="check" type="checkbox"><i></i></label></section><section class="card debug-card"><h2>وضعیت Debug</h2><div class="debug-grid"><span>پیام پیدا شده</span><b id="detected">0</b><span>ارسال به Bing</span><b id="sent">0</b><span>ترجمه موفق</span><b id="success">0</b><span>خطا</span><b id="fail">0</b></div><small id="debugError" class="debug-error">خطایی ثبت نشده</small><button id="resetDebug" class="debug-btn">پاک کردن گزارش</button></section><footer><span>نسخه 0.3.0</span><span>Bing Translator</span></footer></main><script src="popup.js"></script></body></html>
